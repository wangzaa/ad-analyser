[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ad-analysis"
version = "0.1.0"
description = "ETL + dashboard for HK telco Meta/TikTok ad campaigns"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Andrew" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
etl-csv-to-sql = "etl.etl_csv_to_sql:main"
build-bulk-inserts = "etl.build_bulk_inserts:main"

[tool.setuptools.packages.find]
include = ["etl*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
